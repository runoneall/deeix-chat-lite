zerops:
    - setup: docker
      build:
          deployFiles: ./docker-compose.yml
          addToRunPrepare: ./docker-compose.yml

      run:
          base: docker@latest
          envVariables:
              GIN_MODE: ${GIN_MODE}
              JWT_SECRET: ${JWT_SECRET}
              DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
          prepareCommands:
              - docker compose pull
          start: docker compose up --force-recreate
          ports:
              - port: 8080
                httpSupport: true
